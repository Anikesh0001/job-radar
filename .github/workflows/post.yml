name: hourly jobs

# Keeps the channel live around the clock.
#
# This polls a small, high-churn subset of sources (config/fast.yaml — the
# aggregators, search APIs and India feeds, ~20 targets, well under a minute)
# and posts what is new. fetch.yml still does the full 209-target sweep every
# four hours for everything that changes more slowly.
#
# The split exists because company ATS boards change a few times a DAY, so
# polling all 209 hourly would be rude and pointless; the aggregators genuinely
# do change hourly.

on:
  schedule:
    # Every hour at :10 UTC, offset from fetch.yml's on-the-hour slot so the
    # two do not queue behind each other.
    - cron: "10 * * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Exact number to send (leave blank for the usual rate)"
        type: string
        default: ""

# Shared with fetch.yml: both mutate the same database, and two runs writing
# the state release at once would lose whichever finished first.
concurrency:
  group: job-radar-state
  cancel-in-progress: false

permissions:
  contents: write

env:
  STATE_TAG: data

jobs:
  hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No state yet means fetch.yml has never run. Carry on anyway: this
      # config can seed a database perfectly well on its own, and refusing to
      # start would leave the channel silent until the next four-hourly slot.
      - name: Restore database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download "$STATE_TAG" --pattern jobs.db.gz --clobber 2>/dev/null; then
            gunzip -f jobs.db.gz
            echo "restored $(du -h jobs.db | cut -f1) database"
          else
            echo "no state release yet — starting a fresh database"
          fi

      - name: Fetch the fast sources and post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # --notify-limit is passed ONLY for a manual run with an explicit
          # count. On a schedule it must be absent, or it pins the batch to a
          # flat number and defeats the catch-up: GitHub skips about half of
          # these slots, so a fixed 20 per run means the channel's output tracks
          # GitHub's mood instead of the rate we asked for.
          LIMIT="${{ github.event.inputs.count }}"
          if [ -n "$LIMIT" ]; then
            echo "manual run: sending exactly $LIMIT"
            python -m src.run --config config/fast.yaml --export '' \
              --queue-max-age 3 --notify-limit "$LIMIT"
          else
            python -m src.run --config config/fast.yaml --export '' \
              --queue-max-age 3 --notify-rate 15
          fi

      - name: Save state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f jobs.db ] || exit 0
          gzip -9f jobs.db
          gh release view "$STATE_TAG" >/dev/null 2>&1 || \
            gh release create "$STATE_TAG" --title "Live data" \
              --notes "Database and spreadsheet for the job feed. Replaced automatically; do not delete." \
              --latest=false
          gh release upload "$STATE_TAG" jobs.db.gz --clobber

      # An unattended feed that breaks is indistinguishable from an unattended
      # feed with nothing to say. GitHub emails on the first failure of a
      # scheduled workflow and then stays quiet, so tell the channel owner
      # directly, through the bot that is already configured.
      - name: Report failure to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Prefer a private alert chat if one is configured, so operational
          # noise never lands in the public job channel.
          CHAT="${TELEGRAM_ALERT_CHAT_ID:-}"
          if [ -z "$CHAT" ]; then
            echo "no TELEGRAM_ALERT_CHAT_ID set — skipping the alert so this"
            echo "does not post an error message into the public channel"
            exit 0
          fi
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -o /dev/null -X POST \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=job-radar: ${{ github.workflow }} failed on $(date -u +'%Y-%m-%d %H:%M UTC').%0A$RUN" \
            --data-urlencode "disable_web_page_preview=true"
