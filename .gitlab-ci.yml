# GitLab as a backup scheduler for the GitHub workflow.
#
# GitHub's cron is best-effort and, measured on this repo, ran 3 of 6 hourly
# slots with gaps of 2.6 to 5 hours. GitLab's scheduler is markedly more
# punctual, and its free tier is generous, so pointing it at GitHub gives the
# feed a second clock for nothing.
#
# It TRIGGERS the GitHub workflow rather than running the pipeline itself, and
# that distinction matters. Two independent runners would each keep their own
# database, so both would think the same posting was new and the channel would
# get everything twice. One executor, one state, many alarm clocks.
#
# Setup — about three minutes:
#   1. Import this repo at https://gitlab.com/projects/new#cicd_for_external_repo
#      (or just mirror it; only this file is needed).
#   2. Settings -> CI/CD -> Variables -> Add:
#        GH_DISPATCH_TOKEN   your fine-grained PAT, Actions: read and write
#        Masked: yes. Protected: no (scheduled pipelines are unprotected).
#   3. Build -> Pipeline schedules -> New schedule, cron  0 * * * *
#
# The token needs only "Actions: Read and write" on this one repository. It
# cannot read your code, your secrets, or anything else you own.

stages: [trigger]

variables:
  GH_REPO: "Anikesh0001/job-radar"
  GH_WORKFLOW: "post.yml"

trigger-github:
  stage: trigger
  image: curlimages/curl:latest
  # Only ever run on a schedule. Without this it would fire on every push to
  # the mirror as well, which is a second trigger nobody asked for.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"      # the "Run pipeline" button
  script:
    - |
      if [ -z "$GH_DISPATCH_TOKEN" ]; then
        echo "GH_DISPATCH_TOKEN is not set — see the header of this file."
        exit 1
      fi
      code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
        -H "Authorization: Bearer $GH_DISPATCH_TOKEN" \
        -H "Accept: application/vnd.github+json" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        "https://api.github.com/repos/$GH_REPO/actions/workflows/$GH_WORKFLOW/dispatches" \
        -d '{"ref":"main"}')
      # A successful dispatch is 204 with an empty body.
      if [ "$code" = "204" ]; then
        echo "dispatched $GH_WORKFLOW on $GH_REPO"
      else
        echo "dispatch failed: HTTP $code"
        cat /tmp/out
        exit 1
      fi
