  # Any careers page carrying schema.org JobPosting markup. Add the LISTING
  # page, not a single job — and note most listing pages are JS shells with no
  # markup, in which case use `sitemap` instead.
  # jsonld: []      # add entries here to switch this source on

  # Bounded sitemap crawl for companies with no public board at all. Slow and
  # low-yield; reach for it last. '<url>' or '<url>|<max_pages>'.
  # sitemap: []      # add entries here to switch this source on


filters:
  # Keep only IT/software/data/infra roles. Leave this on: the broad sources
  # above are general-purpose, and Bosch alone contributes 1,000 postings that
  # are mostly not tech. Patterns live in src/filters.py (IT_TITLE / NOT_IT).
  it_only: true

  # Set true to see only internships / new-grad / SDE-1 style openings.
  # Off by default so the radar shows every IT role it can reach.
  entry_level_only: false

  # Drop postings demanding more than this many years. 99 = no cap.
  max_years_experience: 99

  # Only surface postings published within this many days. 0 disables it.
  # Postings whose source publishes no date at all always pass — Rippling and
  # BambooHR state none, and rejecting them would delete two working sources
  # rather than stale jobs.
  max_age_days: 30

  # Where the channel is aimed. A posting is kept if it is in one of these
  # places, OR if it is remote from anywhere — see allow_remote below.
  locations:
    - india
    - bangalore
    - bengaluru
    - hyderabad
    - pune
    - chennai
    - mumbai
    - delhi
    - new delhi
    - noida
    - gurgaon
    - gurugram
    - kolkata
    - ahmedabad
    - jaipur
    - kochi
    - coimbatore
    - indore
    - chandigarh
    - thiruvananthapuram
    - visakhapatnam
    - nagpur
    - mysore
    - mysuru
    - bhubaneswar
    - vadodara
    - surat
    - lucknow
    - goa

  # Indeed and several ATSes write "Bengaluru, KA, IN" and never the word
  # "India". Without this a third of the India inventory is dropped.
  countries:
    - in

  # A remote role is worth surfacing wherever the employer sits, so these pass
  # the location check regardless of country.
  allow_remote: true

  # "drop" or "keep". With a country filter on, an unreadable location — an
  # empty string, or Workday's "2 Locations" which never says which — is far
  # more likely to be abroad than local, so it is noise.
  unknown_location: drop

  # Require at least one of these in title or description. Empty = skip.
  keywords: []

  # Companies you never want to hear from again.
  block_companies: []
