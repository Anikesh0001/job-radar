  # ---- Broad search: no slug needed, reaches employers we never listed ----

  # Cross-company SmartRecruiters search. One call per keyword, 100 rows each,
  # no paging — so breadth comes from the keyword list in src/sources.py.
  smartrecruiters_search:

  # Instahyre — India-only and almost entirely IT. ~13k live postings, the
  # single highest-yield India source. Argument is the max to pull per run.
  instahyre:
    - 1400

  # Adzuna. Needs free ADZUNA_APP_ID / ADZUNA_APP_KEY in .env; skips itself
  # silently when they are absent. '<country>|<pages>'. This is the legitimate
  # route to Naukri/Indeed-class inventory — see the README on why there is no
  # scraper for either.
  adzuna:
    - in|8
    - gb|3
    - us|3

  # Scraped boards via python-jobspy. OPT-IN and not installed by default:
  #   pip install -r requirements-optional.txt
  # Without it the source skips itself and says so in --health, so leaving
  # these lines here costs nothing.
  #
  # Format: site|search term|location|count.
  # Only `indeed` and `linkedin` actually return anything — naukri answers
  # "recaptcha required", glassdoor/ziprecruiter/bayt answer 403. Indeed is
  # fast (~100 jobs in 3s); LinkedIn is slow (~100 in 56s) and rate-limits, so
  # keep its counts low.
  jobspy:
    - indeed|software engineer|India|200
    - indeed|backend developer|India|200
    - indeed|full stack developer|India|200
    - indeed|data engineer|India|150
    - indeed|devops engineer|India|150
    - indeed|qa automation|India|100
    - indeed|python developer|India|150
    - indeed|java developer|India|150
    - linkedin|software engineer|India|50
    - linkedin|data scientist|India|50

