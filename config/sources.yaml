# ---------------------------------------------------------------------------
# What job-radar polls.
#
# Every company slug below was verified live by `python discover.py` — it
# probes each name against every ATS and keeps only boards that actually
# return postings. Do not hand-add slugs without checking them: the previous
# version of this file shipped `smartrecruiters: Visa` and `Bosch`, both of
# which return zero (the live Bosch slug is `BoschGroup`).
#
# To grow the list:
#   python discover.py --file config/companies.txt --out found.yaml
# To find what has since died:
#   python verify_slugs.py                 # report
#   python verify_slugs.py --prune         # rewrite this file without them
#   python -m src.run --health             # what has been empty for 3+ runs
#
# Slug format per platform:
#   greenhouse/lever/ashby/workable/...  the path segment in the careers URL
#   workday                              tenant|wdN|SiteName
#   oraclecloud                          host|siteNumber
#   phenom                               the careers hostname
#   rss / jsonld / sitemap               a full URL
# ---------------------------------------------------------------------------

