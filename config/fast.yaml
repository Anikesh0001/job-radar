# ---------------------------------------------------------------------------
# The hourly config, used by .github/workflows/post.yml.
#
# config/sources.yaml polls 209 targets and takes ~5 minutes. Running that
# every hour would hammer 209 public APIs for almost no gain, because company
# ATS boards change a few times a day, not a few times an hour.
#
# This is the subset that genuinely churns hourly — aggregators, search APIs
# and the India-specific feeds — and it runs in well under a minute. Timings
# measured on a clean machine:
#
#   jobicy 0.3s · himalayas 0.3s · remotive 0.4s · arbeitnow 1.0s
#   smartrecruiters_search 1.8s · remoteok 2.1s · workingnomads 2.7s
#   weworkremotely 2.7s · jobspy-indeed 4.5s · instahyre 5.0s
#
# The full sweep in sources.yaml still runs every four hours and picks up
# everything this misses.
# ---------------------------------------------------------------------------

sources:
  # Freshest India IT inventory. Indeed dates everything to the day.
  jobspy:
    # Country-wide sweeps.
    - indeed|software engineer|India|100
    - indeed|backend developer|India|75
    - indeed|full stack developer|India|75
    - indeed|data engineer|India|75
    - indeed|devops engineer|India|50
    - indeed|python developer|India|50
    - indeed|java developer|India|50
    - indeed|qa automation|India|50
    - indeed|react developer|India|50
    - indeed|data scientist|India|50
    - indeed|cloud engineer|India|50
    - indeed|business analyst|India|50
    # Per-city, because a national search under-returns for the smaller hubs.
    - indeed|software engineer|Bangalore, India|75
    - indeed|software engineer|Hyderabad, India|50
    - indeed|software engineer|Pune, India|50
    - indeed|software engineer|Chennai, India|50
    - indeed|software engineer|Noida, India|40
    - indeed|software engineer|Gurugram, India|40
    - indeed|software engineer|Mumbai, India|40
    # Remote, which the location filter keeps wherever the employer sits.
    - indeed|remote software engineer|India|50

  # India-only, almost entirely IT. Six pages is plenty at this cadence.
  instahyre:
    - 420

  # Cross-company search; reaches employers we hold no slug for.
  smartrecruiters_search:

  # Aggregator feeds — cheap and updated continuously.
  remoteok:
  arbeitnow:
  remotive:
  jobicy:
  himalayas:
  workingnomads:

  rss:
    - https://weworkremotely.com/remote-jobs.rss
    - https://weworkremotely.com/categories/remote-programming-jobs.rss
    - https://weworkremotely.com/categories/remote-full-stack-programming-jobs.rss
    - https://himalayas.app/jobs/rss


filters:
  it_only: true
  entry_level_only: false
  max_years_experience: 99

  # Tighter than the full config on purpose: this feed exists to carry what is
  # new, and the four-hourly sweep already has the wider net.
  max_age_days: 7

  # Where the channel is aimed. A posting is kept if it is in one of these
  # places, OR if it is remote from anywhere — see allow_remote below.
  locations:
    - india
    - bangalore
    - bengaluru
    - hyderabad
    - pune
    - chennai
    - mumbai
    - delhi
    - new delhi
    - noida
    - gurgaon
    - gurugram
    - kolkata
    - ahmedabad
    - jaipur
    - kochi
    - coimbatore
    - indore
    - chandigarh
    - thiruvananthapuram
    - visakhapatnam
    - nagpur
    - mysore
    - mysuru
    - bhubaneswar
    - vadodara
    - surat
    - lucknow
    - goa

  # Indeed and several ATSes write "Bengaluru, KA, IN" and never the word
  # "India". Without this a third of the India inventory is dropped.
  countries:
    - in

  # A remote role is worth surfacing wherever the employer sits, so these pass
  # the location check regardless of country.
  allow_remote: true

  # "drop" or "keep". With a country filter on, an unreadable location — an
  # empty string, or Workday's "2 Locations" which never says which — is far
  # more likely to be abroad than local, so it is noise.
  unknown_location: drop
  keywords: []
  block_companies: []
